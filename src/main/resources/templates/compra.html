<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Comprar</title>
	<link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
	<link rel="stylesheet" th:href="@{/webjars/fontawesome/css/font-awesome.min.css}">
	<link rel="stylesheet" th:href="@{/css/styles.css}">
	<link rel="stylesheet" th:href="@{/css/forms.css}">
	<link rel="stylesheet" th:href="@{/css/footer.css}">
</head>

<body>
	<div th:replace="layout/navbar.html :: navbar"></div>

	<div class="container my-5 p-4 bg-white shadow rounded">
		<h3 class="text-center my-3">FORMULARIO DE COMPRA</h3>

		<div class="px-5 pt-5 pb-4">
			<form action="/compra/guardar" th:object="${compra}" method="post">
				<div class="col">
					<label for="cliente">Cliente</label>
					<select class="form-control" name="cliente" id="cliente" th:field="*{cliente.nroDocumento}">
						<option th:each=" cliente: ${clientes}" th:value="${cliente.nroDocumento}">
							<spam th:text="${cliente.nombreApellido}"></spam>-
							<spam th:text="${cliente.nroDocumento}"></spam>
						</option>
					</select><br />
				</div>
				<div class="col">
					<label for="codigo">Producto</label>
					<select class="form-control" name="codigo" id="codigo">
						<option th:each=" producto: ${productos}">
							<spam th:text="${producto.nombre}"></spam>-
						</option>
					</select><br />
				</div>
		</div>
		<div class="d-flex justify-content-center mx-5 mb-4">
			<input class="btn btn-primary btn-block p-2 mx-3" type="submit" value="enviar">
		</div>
		</form>
	</div>
	<div th:replace="layout/footer :: footer"></div>
</body>
<script th:src="@{/webjars/jquery/jquery.min.js}"></script>
<script th:src="@{/webjars/popper.js/umd/popper.min.js}"></script>
<script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>

</html>
